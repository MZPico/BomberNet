<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BomberNet</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 8 / 5; background: #000; outline: none;
           width: min(96vw, 960px, calc((100vh - 60px) * 1.6)); }
  body.touch canvas { width: min(96vw, 960px, calc((100vh - 230px) * 1.6)); }   /* room below for the controls */
  #hint { opacity: .7; text-align: center; padding: 0 16px; }
  /* touch controls: a d-pad, FIRE, ESC and ABC (the phone's keyboard, for a room code) */
  #touch { display: none; width: min(96vw, 960px); justify-content: space-between; align-items: center; gap: 12px;
           user-select: none; -webkit-user-select: none; touch-action: none; }
  body.touch #touch { display: flex; }
  body.touch #hint { display: none; }
  #pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 4px; }
  #touch button { background: #222; color: #ddd; border: 1px solid #555; border-radius: 10px; font: 600 16px system-ui;
                  touch-action: none; }
  #touch button.on { background: #555; }
  #fire { width: 120px; height: 120px; border-radius: 60px !important; font-size: 20px !important;
          display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  #fire small { font-size: 11px; opacity: .7; }
  #fire, #side, #pad, #right { flex-shrink: 0; }
  #right { display: flex; flex-direction: column; align-items: flex-end; gap: 36px; }
  #brk { width: 64px; height: 34px; font-size: 13px !important; }
  @media (max-width: 440px) {                   /* a phone held upright: smaller, so all four fit */
    #pad { grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 3px; }
    #side button { width: 64px; height: 42px; font-size: 14px; }
    #right { gap: 28px; }
    #brk { width: 58px; height: 30px; font-size: 12px !important; }
    #fire { width: 96px; height: 96px; border-radius: 48px !important; font-size: 18px !important; }
    #touch { gap: 6px; }
  }
  #side { display: flex; flex-direction: column; gap: 8px; }
  #side button { width: 72px; height: 44px; }
  #type { position: absolute; left: -9999px; opacity: 0; }

  /* fullscreen: the button; the page itself fills the screen (the browser's fullscreen, or, where a page
     cannot have it (iPhone), the viewport: body.full either way) */
  #fs { position: fixed; top: max(env(safe-area-inset-top), 8px); right: max(env(safe-area-inset-right), 8px); z-index: 3;
        background: #222; color: #ddd; border: 1px solid #555; border-radius: 8px; font: 600 13px system-ui;
        padding: 6px 10px; opacity: .8; }
  #mute { position: fixed; top: max(env(safe-area-inset-top), 8px); right: calc(max(env(safe-area-inset-right), 8px) + 74px); z-index: 3;
          background: #222; color: #ddd; border: 1px solid #555; border-radius: 8px; font: 600 13px system-ui;
          padding: 6px 10px; opacity: .8; }
  #mute.off { color: #888; text-decoration: line-through; }
  body.full { justify-content: center; }
  body.full canvas { width: min(100vw, 160vh); }
  body.full #hint { display: none; }

  /* a touch screen held sideways: the game as large as it goes, the controls over it, see-through */
  body.touch.land { overflow: hidden; }
  body.touch.land canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, 160vh); }
  body.touch.land #touch { position: fixed; inset: 0; display: block; pointer-events: none; z-index: 2; }
  body.touch.land #touch button { pointer-events: auto; opacity: .55; }
  body.touch.land #touch button.on { opacity: .85; }
  body.touch.land #pad { position: absolute; left: max(env(safe-area-inset-left), 12px); bottom: max(env(safe-area-inset-bottom), 12px);
                         grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 3px; }
  body.touch.land #pad span { pointer-events: none; }
  body.touch.land #fire { position: absolute; right: max(env(safe-area-inset-right), 14px); bottom: max(env(safe-area-inset-bottom), 14px);
                          width: 92px; height: 92px; border-radius: 46px !important; }
  body.touch.land #brk { position: absolute; right: max(env(safe-area-inset-right), 12px); top: max(env(safe-area-inset-top), 52px); }
  body.touch.land #side { position: absolute; left: max(env(safe-area-inset-left), 12px); top: max(env(safe-area-inset-top), 12px); }
  body.touch.land #side button { width: 56px; height: 34px; font-size: 13px; }
  body.touch.land #fs, body.touch.land #mute { opacity: .55; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200" tabindex="0"></canvas>
<div id="touch">
  <div id="pad">
    <span></span><button data-k="1">&#9650;</button><span></span>
    <button data-k="3">&#9664;</button><span></span><button data-k="4">&#9654;</button>
    <span></span><button data-k="2">&#9660;</button><span></span>
  </div>
  <div id="side"><button id="abc">ABC</button></div>
  <div id="right">                              <!-- BREAK small, in the top corner, well above BOMB: not hit by mistake -->
    <button id="brk" data-k="7">BREAK</button>
    <button id="fire" data-k="5" data-k2="6">BOMB<small>SPACE</small></button>
  </div>
  <input id="type" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
</div>
<button id="fs" title="Fullscreen">&#x26F6; FULL</button>
<button id="mute" title="Sound on or off">&#x266A; SOUND</button>
<div id="hint">Cursor keys and SPACE &middot; W A S D and E &middot; ESC leaves a match &middot; letters type a room code</div>
<script>
// BomberNet compiled to WebAssembly (c/platform/web, docs/port-web.md).
// ?relay=ws://host:port picks the relay (else the page's own origin over https, or the game's built-in one).
(function () {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(320, 200);
  const params = new URLSearchParams(location.search);
  const KEYS = { ArrowUp: 1, ArrowDown: 2, ArrowLeft: 3, ArrowRight: 4, Space: 5, Enter: 6, NumpadEnter: 6,
                 Escape: 7, Backspace: 8, Delete: 9 };
  let audio = null;
  let muted = false;                              // the SOUND button; remembered in this browser
  try { muted = localStorage.getItem('bombernet-mute') === '1'; } catch (err) {}

  function keyId(e) {
    if (KEYS[e.code]) return KEYS[e.code];
    if (/^Key[A-Z]$/.test(e.code)) return e.code.charCodeAt(3);
    return 0;
  }
  function key(e, down) {
    const id = keyId(e);
    if (!id || !Module._web_key) return;
    e.preventDefault();
    Module._web_key(id, down ? 1 : 0);
    if (down && !audio) {                         // sound only after a user gesture
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
    }
  }
  window.addEventListener('keydown', (e) => key(e, true));
  window.addEventListener('keyup', (e) => key(e, false));
  window.addEventListener('blur', () => { if (Module._web_key) for (let i = 1; i < 128; i++) Module._web_key(i, 0); });

  function pads() {                               // the Gamepad API: d-pad or left stick, any face button fires
    if (!navigator.getGamepads || !Module._web_pad) return;
    const list = navigator.getGamepads();
    for (let n = 0; n < 2; n++) {
      const g = list[n];
      if (!g) continue;
      const b = (i) => g.buttons[i] && g.buttons[i].pressed, ax = (i) => g.axes[i] || 0;
      let m = 0;
      if (b(12) || ax(1) < -0.5) m |= 1;
      if (b(13) || ax(1) > 0.5) m |= 2;
      if (b(15) || ax(0) > 0.5) m |= 4;
      if (b(14) || ax(0) < -0.5) m |= 8;
      if (b(0) || b(1) || b(2) || b(3)) m |= 16;
      Module._web_pad(n, m);
    }
  }

  window.Module = {
    canvas,
    bombernetRelay: params.get('relay') || '',
    bombernetTrace: params.has('trace'),            // the tests: hashes and maps every 16th frame
    bombernetPresent(p) {
      image.data.set(HEAPU8.subarray(p, p + 320 * 200 * 4));
      ctx.putImageData(image, 0, 0);
      pads();
    },
    bombernetTone(hz, ms) {
      if (!audio || muted) return;
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = 'square'; o.frequency.value = hz;
      g.gain.value = 0.08;
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + ms / 1000);
    },
    print: (s) => console.log(s),
    printErr: (s) => console.warn(s),
  };
  const muteBtn = document.getElementById('mute');
  const showMute = () => { muteBtn.textContent = muted ? '\u266A MUTED' : '\u266A SOUND'; muteBtn.classList.toggle('off', muted); };
  muteBtn.addEventListener('click', () => { muted = !muted; showMute(); try { localStorage.setItem('bombernet-mute', muted ? '1' : '0'); } catch (err) {} });
  showMute();
  // touch: each button holds its key while pressed (pointer events: fingers and the mouse alike)
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0 || params.has('touch')) document.body.classList.add('touch');
  function hold(b, id, id2) {                         // FIRE holds SPACE and RETURN: key set A fires with RETURN
    const set = (v) => { if (!Module._web_key) return; Module._web_key(id, v); if (id2) Module._web_key(id2, v); };   // when two share the keyboard
    const up = (e) => { e.preventDefault(); b.classList.remove('on'); set(0); };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on');
      set(1);
      if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
    });
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  }
  document.querySelectorAll('#touch [data-k]').forEach((b) => hold(b, Number(b.dataset.k), Number(b.dataset.k2 || 0)));
  const type = document.getElementById('type');      // a room code from the phone's keyboard: each letter a key tap
  const tap = (id) => { if (!Module._web_key) return; Module._web_key(id, 1); setTimeout(() => Module._web_key(id, 0), 150); };
  document.getElementById('abc').addEventListener('click', () => { type.value = ''; type.focus(); });
  type.addEventListener('input', () => {
    const v = type.value.toUpperCase();
    for (const ch of v) if (ch >= 'A' && ch <= 'Z') tap(ch.charCodeAt(0));
    type.value = '';
  });
  type.addEventListener('keydown', (e) => { if (e.key === 'Backspace') tap(8); if (e.key === 'Enter') { tap(5); type.blur(); } });
  // sideways on a touch screen: the controls over the game (body.land)
  const land = matchMedia('(orientation: landscape)');
  const setLand = () => document.body.classList.toggle('land', land.matches);
  land.addEventListener('change', setLand); setLand();
  // fullscreen: the browser's where a page may have it (then landscape locked where the browser allows),
  // else the viewport (an iPhone's Safari gives pages no fullscreen)
  const fsBtn = document.getElementById('fs');
  const inFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const sync = () => {
    const on = inFs() || document.body.classList.contains('pseudo');
    document.body.classList.toggle('full', on);
    fsBtn.textContent = on ? '\u2715 EXIT' : '\u26F6 FULL';
  };
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  fsBtn.addEventListener('click', async () => {
    const el = document.documentElement;
    if (inFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (document.body.classList.contains('pseudo')) { document.body.classList.remove('pseudo'); sync(); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
      try {
        await req.call(el, { navigationUI: 'hide' });
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
      } catch (e) { document.body.classList.add('pseudo'); }
    } else document.body.classList.add('pseudo');
    sync(); canvas.focus();
  });
  canvas.focus();
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
