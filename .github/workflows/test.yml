# The deterministic tests: no emulator in real time, nothing that depends on
# the machine's speed. Every recording replayed (the host simulator native and
# big-endian, the browser build in Node.js, the Spectrum and the CPC in the
# Python emulators); network matches through the local relay (the Spectrum, 2
# and 4 players, its stack watermark; the CPC; against BomberNet 0.2.0 both
# ways); the relay's protocol test and the software network device.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:                                # the release workflow runs it too

defaults:
  run:
    shell: bash                                 # named: then bash runs with -e -o pipefail (unnamed: -e only, and a failing
                                                # command piped into tail would pass)

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}   # (called by release.yml: the caller's name, a group of its own)
  cancel-in-progress: true

jobs:
  portable:
    name: replays, little- and big-endian
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: QEMU and Zig
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static
          python3 -m venv build/venv && build/venv/bin/pip install -q ziglang
      - run: tools/test_portable.sh

  web:
    name: replays, the browser build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: toolchain versions
        run: grep -v '^#' tools/ci/toolchains.env >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: emsdk
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Emscripten
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION" && ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - run: EMSDK=~/emsdk python3 tools/web_test.py

  relay:
    name: relay and software network device
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the relay
        run: |
          python3 -m venv build/venv && build/venv/bin/pip install -q -r relay/requirements.txt
          (cd relay && ../build/venv/bin/uvicorn relay:app --host 127.0.0.1 --port 8765 > ../build/relay.log 2>&1 &)
          for i in $(seq 50); do nc -z 127.0.0.1 8765 && break; sleep 0.2; done
      - name: the relay's protocol
        run: build/venv/bin/python relay/test_relay.py ws://127.0.0.1:8765/net
      - name: software network device, JSON input lines
        run: |
          (cd c && mkdir -p build && cc -O1 -DHOST -Icore -Icommon -Iplatform/host platform/host/softnet_test.c \
             common/netdev_soft.c common/ws.c platform/host/tcp_posix.c -o build/softnet_test)
          sh tools/softnet_test.sh 60
      - name: software network device, binary input lines
        run: |
          (cd c && cc -O1 -DHOST -DNET_BINARY_INPUT -Icore -Icommon -Iplatform/host platform/host/softnet_test.c \
             common/netdev_soft.c common/ws.c platform/host/tcp_posix.c -o build/softnet_test)
          sh tools/softnet_test.sh 60
      - if: failure()
        run: tail -100 build/relay.log

  z80:
    name: Spectrum and CPC in the Python emulators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                        # the v0.2.0 tag, for the mixed-version matches
      - name: toolchain versions
        run: grep -v '^#' tools/ci/toolchains.env >> "$GITHUB_ENV"
      - name: builds (z88dk in Docker)
        run: |
          docker pull -q "$Z88DK_IMAGE"
          export PATH="$PWD/tools/ci/z88dk:$PATH"
          for p in zx:zx zx128:zx128 cpc:cpc; do
            mkdir -p build/${p#*:} && (cd build/${p#*:} && cmake -DPLATFORM=${p%%:*} ../../c > /dev/null && make)
          done
          git worktree add -q build/v020 v0.2.0
          mkdir -p build/v020/build/zx && (cd build/v020/build/zx && cmake -DPLATFORM=zx ../../c > /dev/null && make)
      - name: emulators and the relay
        run: |
          python3 -m venv build/venv && build/venv/bin/pip install -q "zx==$ZX_EMU_VERSION" "z80==$Z80_EMU_VERSION" numpy pillow -r relay/requirements.txt
          (cd relay && ../build/venv/bin/uvicorn relay:app --host 127.0.0.1 --port 8765 > ../build/relay.log 2>&1 &)
          for i in $(seq 50); do nc -z 127.0.0.1 8765 && break; sleep 0.2; done
      - name: replays, Spectrum
        run: for r in tests/recordings/*.bnr; do echo "== $r"; build/venv/bin/python tools/replay_zx.py "$r" | tail -1; done
      - name: replays, CPC
        run: for r in tests/recordings/*.bnr; do echo "== $r"; build/venv/bin/python tools/replay_cpc.py "$r" | tail -1; done
      - name: Spectrum match, 2 players
        run: QUIET=1 build/venv/bin/python tools/lockstep_zx.py 300
      - name: Spectrum 48K match, 4 players, stack watermark
        run: PLAYERS=4 LOCAL_A=2 LOCAL_B=2 KEYS=tests/recordings/dm4.bnr QUIET=1 STACK_MIN=150 build/venv/bin/python tools/lockstep_zx.py 600
      - name: Spectrum 128K match, 4 players, stack watermark
        run: A_BUILD=build/zx128 B_BUILD=build/zx128 PLAYERS=4 LOCAL_A=2 LOCAL_B=2 KEYS=tests/recordings/dm4.bnr QUIET=1 STACK_MIN=100 build/venv/bin/python tools/lockstep_zx.py 600
      - name: CPC match
        run: build/venv/bin/python tools/lockstep_cpc.py 300
      - name: against BomberNet 0.2.0, both ways
        run: |
          B_BUILD=build/v020/build/zx QUIET=1 build/venv/bin/python tools/lockstep_zx.py 300
          A_BUILD=build/v020/build/zx QUIET=1 build/venv/bin/python tools/lockstep_zx.py 300
      - if: failure()
        run: tail -100 build/relay.log
